name: Build VaPuClaimer EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name "VaPuClaimer" `
            --add-data "vapu-vehicles.source.json;." `
            --add-data "version.txt;." `
            VaPuClaimer.pyw

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v6
        with:
          name: VaPuClaimer-Windows
          path: dist/VaPuClaimer.exe
