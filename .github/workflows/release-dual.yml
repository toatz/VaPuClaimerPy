name: Release VaPuClaimer Python + EXE

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. v1.3.0"
        required: true
        default: "v1.3.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install PyInstaller
        run: python -m pip install --disable-pip-version-check pyinstaller

      - name: Syntax check
        run: python -m compileall -q VaPuClaimer.pyw vapuclaimer tests tools

      - name: Validate vehicle data
        run: python tools/validate_data.py

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Set release version
        shell: pwsh
        run: |
          Set-Content -Path version.txt -Value "${{ inputs.version }}" -Encoding utf8

      - name: Clean Python cache
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Directory -Filter __pycache__ | Remove-Item -Recurse -Force
          Get-ChildItem -Recurse -File -Include *.pyc,*.pyo | Remove-Item -Force

      - name: Package Python ZIP
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          $name = "VaPuClaimer-Python-$version"

          New-Item -ItemType Directory -Force "dist\$name" | Out-Null

          Copy-Item VaPuClaimer.pyw "dist\$name\"
          Copy-Item run.bat "dist\$name\"
          Copy-Item version.txt "dist\$name\"
          Copy-Item vapu-vehicles.source.json "dist\$name\"
          Copy-Item settings.ini.example "dist\$name\"
          Copy-Item README.md "dist\$name\"
          Copy-Item CHANGELOG.md "dist\$name\"
          Copy-Item vapuclaimer "dist\$name\vapuclaimer" -Recurse

          Compress-Archive `
            -Path "dist\$name\*" `
            -DestinationPath "dist\$name.zip" `
            -Force

          $hash = (Get-FileHash "dist\$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Set-Content "dist\$name.zip.sha256" -Encoding ascii

      - name: Build standalone Windows EXE
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          $exeName = "VaPuClaimer-Windows-$version"

          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name "$exeName" `
            --add-data "vapu-vehicles.source.json;." `
            --add-data "version.txt;." `
            VaPuClaimer.pyw

      - name: Create EXE checksum
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          $name = "VaPuClaimer-Windows-$version.exe"
          $path = "dist\$name"

          if (-not (Test-Path $path)) {
            throw "Expected EXE was not created: $path"
          }

          $hash = (Get-FileHash $path -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Set-Content "dist\$name.sha256" -Encoding ascii

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: VaPuClaimer-${{ inputs.version }}
          path: |
            dist/VaPuClaimer-Python-${{ inputs.version }}.zip
            dist/VaPuClaimer-Python-${{ inputs.version }}.zip.sha256
            dist/VaPuClaimer-Windows-${{ inputs.version }}.exe
            dist/VaPuClaimer-Windows-${{ inputs.version }}.exe.sha256

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ inputs.version }}"

          gh release create "$version" `
            "dist/VaPuClaimer-Python-$version.zip" `
            "dist/VaPuClaimer-Python-$version.zip.sha256" `
            "dist/VaPuClaimer-Windows-$version.exe" `
            "dist/VaPuClaimer-Windows-$version.exe.sha256" `
            --title "VaPuClaimer $version" `
            --generate-notes
