name: Check VaPuClaimer Python

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Syntax check
        run: python -m compileall -q VaPuClaimer.pyw vapuclaimer tests tools

      - name: Validate vehicle data
        run: python tools/validate_data.py

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Clean Python cache
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Directory -Filter __pycache__ | Remove-Item -Recurse -Force
          Get-ChildItem -Recurse -File -Include *.pyc,*.pyo | Remove-Item -Force

      - name: Package source artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\VaPuClaimer-Python | Out-Null

          Copy-Item VaPuClaimer.pyw dist\VaPuClaimer-Python\
          Copy-Item run.bat dist\VaPuClaimer-Python\
          Copy-Item version.txt dist\VaPuClaimer-Python\
          Copy-Item vapu-vehicles.source.json dist\VaPuClaimer-Python\
          Copy-Item settings.ini.example dist\VaPuClaimer-Python\
          Copy-Item README.md dist\VaPuClaimer-Python\
          Copy-Item CHANGELOG.md dist\VaPuClaimer-Python\
          Copy-Item vapuclaimer dist\VaPuClaimer-Python\vapuclaimer -Recurse

          Compress-Archive `
            -Path dist\VaPuClaimer-Python\* `
            -DestinationPath dist\VaPuClaimer-Python.zip `
            -Force

      - name: Upload source artifact
        uses: actions/upload-artifact@v6
        with:
          name: VaPuClaimer-Python
          path: dist/VaPuClaimer-Python.zip
